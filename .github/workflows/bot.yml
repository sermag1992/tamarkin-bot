name: tamarkin-bot

on:
  schedule:
    # каждые 15 минут: избыточность на случай, когда GitHub роняет плановые запуски
    - cron: "11,26,41,56 * * * *"
  workflow_dispatch: {}  # ручной запуск кнопкой в интерфейсе

permissions:
  contents: write  # нужен, чтобы коммитить posted.json и очередь одобрений

concurrency:
  group: tamarkin-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip  # кэш пакетов ускоряет каждый прогон

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Обработать решения владельца и отправить кандидатов
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          RSS_URLS: "https://www.sostav.ru/rss/,https://4pda.to/feed/"
          IMAGE_MODE: "rss"
          TEXT_HOOK_ENABLED: "1"
          LLM_FILTER_ENABLED: "1"
          KEYWORDS: ""  # пусто — релевантность решает LLM-фильтр, затем владелец
          CHECK_INTERVAL_MINUTES: "0"  # один прогон и выход
          LOG_LEVEL: "INFO"
        run: python main.py

      - name: Сохранить состояние (дедупликация и очередь одобрений)
        run: |
          git config user.name "tamarkin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posted.json pending.json updates_offset.json owner.json
          git diff --staged --quiet || (git commit -m "обновление состояния [skip ci]" && git push)
